<main class="container">
  <h1>Cadastro de livros</h1>

  <button type="button" (click)="abrirFormulario()">
    Cadastrar livro
  </button>

  @if (mostrarFormulario()) {
    <app-formulario-livro
      (salvar)="criarLivro($event)"
      (cancelar)="fecharFormulario()"
    />
  }

  <app-filtro-livros
    [pesquisa]="pesquisa()"
    [status]="filtroStatus()"
    (pesquisaChange)="atualizarPesquisa($event)"
    (statusChange)="atualizarStatus($event)"
  />

  <app-lista-livros
    [livros]="livrosFiltrados()"
    [carregando]="carregando()"
    [erro]="erro()"
    (excluir)="removerLivro($event)"
    (alterarStatus)="alternarStatusLivro($event)"
  />
</main>
